name: Source and dataset checks

on: [push, pull_request]

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - run: python -m pip install -r requirements.txt
      - run: python -m compileall -q .
      - run: python main.py demo
      - run: python main.py steel-download
      - name: Run the full offline suite with real UCI records
        run: python -m unittest -q

  postgres:
    runs-on: ubuntu-latest
    services:
      db:
        image: pgvector/pgvector:0.8.7-pg17
        env:
          POSTGRES_USER: evidenceops
          POSTGRES_DB: evidenceops
          POSTGRES_PASSWORD: ci-test-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U evidenceops -d evidenceops"
          --health-interval 5s --health-timeout 3s --health-retries 12
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - run: python -m pip install -r requirements.txt
      - name: Test PostgreSQL and pgvector with synthetic records
        env:
          EVIDENCEOPS_TEST_DATABASE_URL: postgresql://evidenceops:ci-test-only-password@127.0.0.1:5432/evidenceops
        run: python postgres_smoke.py
